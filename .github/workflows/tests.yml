name: RekordboxCLI tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: rekordbox --help
      - run: cli-anything-rekordbox --version
